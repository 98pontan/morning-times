name: Morning Times CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write


jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - name: Check out repository source code
        uses: https://github.com/actions/checkout@v4

      - name: Install Docker CLI
        run: |
          curl -fsSL https://download.docker.com/linux/debian/gpg | apt-key add -
          echo "deb https://download.docker.com/linux/debian bookworm stable" > /etc/apt/sources.list.d/docker.list
          apt-get update && apt-get install -y docker-ce-cli docker-buildx-plugin

      - name: Compute registry host (strip protocol scheme)
        id: registry
        run: |
          HOST="${{ github.server_url }}"
          HOST="${HOST#https://}"
          HOST="${HOST#http://}"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"

      - name: Log in to Forgejo Container Registry
        uses: https://github.com/docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: https://github.com/docker/metadata-action@v5
        with:
          images: ${{ steps.registry.outputs.host }}/${{ github.repository }}
          # Every push gets sha-<7 chars>: that is the tag dev and prod deploy. Also: branch -> its
          # name, tag v0.1.0 -> 0.1.0 and 0.1, main -> latest (not used by the cluster after the
          # first promotion).
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: https://github.com/docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Feature/release branches deploy to the dev namespace: write this commit's image tag
      # to rke2-gitops, and ArgoCD rolls it out. Prod only changes when the release-to-main Argo
      # workflow (UI submit or an rc-* tag) promotes a tested sha-* image.
      # GITOPS_TOKEN: GitHub token with "Contents: read and write" on 98pontan/rke2-gitops.
      - name: Deploy to dev (rke2-gitops)
        if: github.ref_type == 'branch' && github.ref_name != 'main'
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          command -v git >/dev/null || { apt-get update && apt-get install -y git; }
          TAG="sha-$(echo "$SHA" | cut -c1-7)"
          git clone --depth 1 "https://x-access-token:${GITOPS_TOKEN}@github.com/98pontan/rke2-gitops.git" gitops
          cd gitops
          git config user.name "Forgejo CI"
          git config user.email "forgejo-ci@pontus-homelab.space"
          printf '# Written by Forgejo CI on every push to a non-main branch. Do not edit by hand.\n# %s @ %s\nimage:\n  tag: "%s"\n' \
            "$BRANCH" "$SHA" "$TAG" > workload-apps-dev/morning-times/image.yaml
          git add workload-apps-dev/morning-times/image.yaml
          git diff --cached --quiet && { echo "dev already runs $TAG"; exit 0; }
          git commit -m "Deploy morning-times $BRANCH ($TAG) to dev"
          # The other app's pipeline or the Argo release workflow may have pushed in the meantime
          for attempt in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            sleep $((attempt * 3))
            git pull --rebase origin main
          done
          echo "Could not push to rke2-gitops"; exit 1
