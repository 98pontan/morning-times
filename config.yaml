# Runtime settings. Override any value with APP_<SECTION>__<KEY>, e.g. APP_SCHEDULER__BRIEF_TIME=07:00.
# Secrets come from environment variables only: DATABASE_URL, ANTHROPIC_API_KEY, EMAIL_PASSWORD.
# Sections, sources, stocks, teams and regions live in the database (seeded from seed.yaml once).

server:
  host: 0.0.0.0
  port: 8080

database:
  # Local development default. In the cluster: DATABASE_URL=postgresql+psycopg://user:pass@host:5432/morning_times
  url: sqlite:///./morning-times.db
  migrate_on_startup: true

scheduler:
  enabled: true
  timezone: Europe/Stockholm
  ingest_interval_minutes: 15
  alerts_interval_minutes: 30
  brief_time: "06:30"

email:
  enabled: true
  smtp_host: smtp.gmail.com
  smtp_port: 587
  sender: pjirbratt@gmail.com
  recipients:
    - pjirbratt@yahoo.com
  password_env: EMAIL_PASSWORD

# Keycloak login. Off: anyone can change everything (local development).
# On: anyone can read; changes need a logged-in member of required_group, and watches are personal.
auth:
  enabled: false
  issuer: https://keycloak.pontus-homelab.space/auth/realms/homelab
  client_id: morning-times
  required_group: newspaper

ai:
  # auto | claude | gemini | mistral | openrouter | ollama | rules
  # auto = claude if ANTHROPIC_API_KEY is set, else the first available provider in fallbacks, else rules (no AI).
  provider: gemini
  claude_model: claude-opus-5-5
  gemini_model: gemini-3.8-flash       # free tier; gemini-3.5-flash-lite is lighter
  # Tried in order when the main provider fails (outage, "high demand", quota). Providers without
  # an API key (MISTRAL_API_KEY, OPENROUTER_API_KEY) or ollama_url are skipped.
  fallbacks: [gemini, mistral, openrouter, ollama]
  models:
    mistral: mistral-small-latest      # paid (pay-as-you-go), API keys need billing since Nov 2026
    openrouter: google/gemma-4-31b-it:free   # free, ~50 requests/day; falls back to openrouter/free
    ollama: qwen3:4b                   # local, fully private
  ollama_url: ""                       # e.g. http://ollama.ollama.svc:11434/v1
  brief_effort: medium
  rating_effort: low
  alert_threshold: 7
  max_articles_per_section: 40
  language: Swedish

seed_file: seed.yaml
